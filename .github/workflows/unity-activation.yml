name: Unity license activation

on: workflow_dispatch

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      ULF_FILE: ${{ github.workspace }}/Unity.ulf
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 2022.3.62f3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install --global unity-license-activate

      - name: Exchange activation file for a license
        run: |
          unity-license-activate \
            "${{ secrets.UNITY_EMAIL }}" \
            "${{ secrets.UNITY_PASSWORD }}" \
            "${{ steps.alf.outputs.filePath }}"

      # Piped straight into gh so the license never becomes a step output or an
      # action input, where it would be visible in the run log.
      - name: Store license as UNITY_LICENSE secret
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_SECRETS_TOKEN }}
        run: gh secret set UNITY_LICENSE -R "${{ github.repository }}" < "$ULF_FILE"
